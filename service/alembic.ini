# Alembic configuration for the Keystone service.
#
#   cd service && uv run alembic upgrade head
#   cd service && uv run alembic downgrade base
#
# `sqlalchemy.url` is intentionally EMPTY. The URL comes from DATABASE_URL via
# recon.config inside migrations/env.py -- a DSN is never written into a file
# that gets committed. Override the target for a one-off run with:
#
#   DATABASE_URL=postgresql+psycopg://... uv run alembic upgrade head
#   uv run alembic -x db_url=postgresql+psycopg://... upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
